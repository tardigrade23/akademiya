name: Check reading links

# Checks the links in data/extras.json ("Əlavə oxu"). Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: python3 tools/check_links.py
