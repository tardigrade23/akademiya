name: Deploy Akademiya to GitHub Pages

# Publishes the installable app whenever the default branch changes.
on:
  push:
    # Only app files trigger a redeploy; docs and helper workflows don't.
    paths-ignore:
      - 'README.md'
      - '.github/workflows/site.yml'
      - '.github/workflows/links.yml'
      - '.github/workflows/images.yml'
      - 'tools/check_links.py'
      - 'tools/fetch_images.py'
      - 'tools/images.json'
      - 'data/links.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: bash tools/build_pwa.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
