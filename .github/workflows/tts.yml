name: Generate lesson audio

# Creates Azerbaijani narration for lessons with Meta's open MMS-TTS model and commits the MP3s.
# Run it by hand from the Actions tab. "lessons" limits the run, e.g. "mentiq:1,kvant:2" (0-based);
# leave it empty to generate every lesson that has no audio yet.
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 'course:lesson list (0-based), empty = all missing'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40" beautifulsoup4 numpy
          ffmpeg -version | head -1
      - name: Generate audio
        run: python3 tools/tts/make_audio.py "${{ github.event.inputs.lessons }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/*/audio
          git diff --cached --quiet && exit 0
          git commit -m "Add lesson audio (${{ github.event.inputs.lessons || 'all' }})"
          git pull --rebase origin main
          git push
